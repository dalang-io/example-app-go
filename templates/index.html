<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* Brutalist theme overrides */
        :root {
            --brutalist-border: 3px solid #000;
            --brutalist-shadow: 6px 6px 0px #000;
        }
        .brutalist-card {
            border: var(--brutalist-border);
            box-shadow: var(--brutalist-shadow);
            background: #fff;
        }
        .brutalist-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #000;
        }
        .brutalist-btn {
            border: 3px solid #000 !important;
            box-shadow: 4px 4px 0px #000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .brutalist-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }
        .brutalist-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .brutalist-input {
            border: 3px solid #000 !important;
            font-weight: 600;
        }
        .brutalist-input:focus {
            outline: none;
            box-shadow: 4px 4px 0px #000;
        }
        body {
            background: #f5f5f5;
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
        }
        .todo-done {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="brutalist-card p-6 mb-8 bg-yellow-300">
            <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight">
                BRUTAL<br>TODOS
            </h1>
            <p class="mt-2 text-lg font-bold">Go + HTMX + DaisyUI</p>
        </div>

        <!-- Add Todo Form -->
        <form
            hx-post="/todos/add"
            hx-target="#todo-list"
            hx-swap="innerHTML"
            class="brutalist-card p-6 mb-6 bg-white"
        >
            <div class="flex gap-4">
                <input
                    type="text"
                    name="text"
                    placeholder="What needs to be done?"
                    class="brutalist-input input input-bordered flex-1 text-lg"
                    required
                />
                <button type="submit" class="brutalist-btn btn btn-primary bg-black text-white hover:bg-gray-800">
                    ADD
                </button>
            </div>
        </form>

        <!-- Todo List -->
        <div class="brutalist-card p-6 bg-white">
            <h2 class="text-2xl font-black uppercase mb-4 border-b-4 border-black pb-2">Tasks</h2>
            <div id="todo-list">
                {{template "todos.html" .}}
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="font-bold text-gray-600">
                Deploy this app on <a href="https://dalang.io" class="underline hover:text-black">Dalang.io</a>
            </p>
        </div>
    </div>
</body>
</html>
